<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>深流潜航</title>
  <style>
    :root { color-scheme: dark; --bg: #0c1218; --ink: #d8f4f2; --dim: #7fb7bc; --panel: rgba(10, 24, 32, 0.72); }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    body { font: 12px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; color: var(--ink);
      -webkit-user-select: none; user-select: none; touch-action: none; }
    #stage { position: fixed; inset: 0; overflow: hidden; cursor: crosshair; }
    #view { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

    .panel { position: fixed; background: var(--panel); border: 1px solid rgba(142, 244, 243, 0.22);
      padding: 6px 9px; letter-spacing: 0.08em; text-transform: uppercase; }
    #gauge { left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; gap: 14px; align-items: baseline; pointer-events: none; }
    #gauge b { font-size: 16px; font-weight: 700; color: #fff6d8; letter-spacing: 0.04em; }
    #gauge small { color: var(--dim); }
    #zone { color: var(--dim); }
    #nitro { display: inline-block; width: 64px; height: 8px; border: 1px solid rgba(142, 244, 243, 0.35); vertical-align: middle; position: relative; }
    #nitro-fill { position: absolute; left: 1px; top: 1px; bottom: 1px; width: 100%; max-width: calc(100% - 2px); background: #5e8f92; }
    #nitro.ready #nitro-fill { background: #8ef4f3; }
    #nitro.on #nitro-fill { background: #fff6d8; }
    #btn-view { right: calc(12px + env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); cursor: pointer; color: var(--ink); font: inherit; letter-spacing: 0.1em; }
    #btn-view::before { content: '视角 · '; color: var(--dim); }
    body.scope #gauge { display: none; }
    #btn-view:hover, #btn-view:focus-visible { border-color: rgba(142, 244, 243, 0.6); outline: none; }
    #help { left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); text-align: center; max-width: calc(100vw - 32px);
      transition: opacity 0.8s; pointer-events: none; text-transform: none; line-height: 1.7; }
    #help.hide { opacity: 0; }
    #help kbd { color: #fff6d8; font: inherit; }
    #help .t { display: none; }
    body.touch #help .m { display: none; }
    body.touch #help .t { display: inline; }
    #toast { left: 50%; top: 18%; transform: translateX(-50%); opacity: 0; transition: opacity 0.6s; pointer-events: none;
      font-size: 14px; letter-spacing: 0.3em; }
    #toast.show { opacity: 1; }
    #touch { display: none; position: fixed; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); gap: 10px; align-items: flex-end; }
    body.touch #touch { display: flex; }
    #touch .col { display: flex; flex-direction: column; gap: 10px; }
    #touch button { width: 60px; height: 60px; border-radius: 0; background: var(--panel); color: var(--ink); font: inherit;
      border: 1px solid rgba(142, 244, 243, 0.3); letter-spacing: 0.05em; touch-action: none; }
    #touch button.on { background: rgba(142, 244, 243, 0.3); }
    #touch #btn-boost { width: 76px; height: 76px; color: #fff6d8; }
    #touch #btn-nitro { width: 76px; color: #8ef4f3; }
    body.touch #help { bottom: auto; top: calc(56px + env(safe-area-inset-top, 0px)); }
    @media (max-width: 520px) { #gauge { gap: 10px; } #gauge b { font-size: 14px; } }
  </style>
</head>
<body>
  <div id="stage"><canvas id="view"></canvas></div>
  <div id="gauge" class="panel">
    <span><small>深度</small> <b id="depth">000</b><small>m</small></span>
    <span><small>航速</small> <b id="speed">00</b><small>kn</small></span>
    <span><small>氮气</small> <i id="nitro"><i id="nitro-fill"></i></i></span>
    <span id="zone">青绿海域</span>
  </div>
  <button id="btn-view" class="panel" data-ui>尾随</button>
  <div id="help" class="panel">
    <span class="m">鼠标在潜艇左右转向、上下升降 · <kbd>点击</kbd>翻滚 · <kbd>按住</kbd>加速 · <kbd>F</kbd>/<kbd>右键</kbd>氮气 · <kbd>W</kbd>/<kbd>S</kbd> 或滚轮 上浮下潜 · <kbd>空格</kbd>切换尾随/潜望镜 · <kbd>H</kbd>说明</span>
    <span class="t">按住屏幕拖动转向 · 轻点翻滚 · 右下角加速、氮气和上浮下潜 · 右上角切换尾随/潜望镜</span>
  </div>
  <div id="toast" class="panel"></div>
  <div id="touch" data-ui>
    <div class="col"><button id="btn-up" data-ui>上浮</button><button id="btn-down" data-ui>下潜</button></div>
    <div class="col"><button id="btn-nitro" data-ui>氮气</button><button id="btn-boost" data-ui>加速</button></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
