<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9f3f1">
<meta name="description" content="把音量滑杆做成一枚玻璃潜水球：向右拖动，从海面一路潜到 6,000 米深处。">
<title>Deep Dive Switch</title>
<style>
:root{
  --bg:#c9f3f1; --bg2:#eefcfb; --ink:#073241; --ink2:rgba(7,50,65,.62); --line:rgba(7,50,65,.16);
  --panel:rgba(255,255,255,.34); --chip:rgba(7,50,65,.08); --accent:#0d7f95; --accent-ink:#ffffff; --sun:1; --w:720px;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{
  margin:0;min-height:100%;min-height:100dvh;color:var(--ink);font-family:var(--sans);
  background:var(--bg);
  background-image:
    radial-gradient(90% 60% at 50% -8%, var(--bg2), transparent 72%),
    linear-gradient(180deg, transparent 55%, rgba(0,0,0,.16));
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overflow-x:hidden;transition:color .45s ease;
  display:flex;align-items:center;justify-content:center;
  padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
/* 海面光柱：越深越淡 */
.rays{position:fixed;inset:-10% -20% auto;height:70vh;pointer-events:none;opacity:calc(var(--sun) * .55);
  background:repeating-linear-gradient(105deg, rgba(255,255,255,.0) 0 46px, rgba(255,255,255,.22) 60px, rgba(255,255,255,0) 92px);
  -webkit-mask-image:linear-gradient(180deg,#000,transparent);mask-image:linear-gradient(180deg,#000,transparent);
  animation:rays 14s ease-in-out infinite alternate}
@keyframes rays{to{transform:translateX(60px)}}
.stage{position:relative;width:var(--w);max-width:100%;display:flex;flex-direction:column;align-items:center;gap:18px}
header{text-align:center;display:flex;flex-direction:column;gap:6px}
.eyebrow{font:600 12px/1 var(--mono);letter-spacing:.34em;text-transform:uppercase;color:var(--ink2);margin:0;padding-left:.34em}
h1{margin:0;font:700 clamp(22px,4.4vw,34px)/1.15 var(--sans);letter-spacing:.01em}
h1 .glass{font-weight:400;color:var(--ink2)}
.slider-wrap{position:relative;width:100%;display:flex;flex-direction:column;align-items:center}
.slider{position:relative;display:block;touch-action:none;cursor:grab;outline:none;border-radius:14px;user-select:none;-webkit-user-select:none}
.slider.dragging{cursor:grabbing}
.slider canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.ruler{position:relative;height:30px;margin-top:2px;font:500 11px/1 var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums}
.ruler span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;padding-top:9px}
.ruler span::before{content:"";position:absolute;left:50%;top:0;width:1px;height:6px;background:currentColor;opacity:.7}
.readout{width:100%;display:grid;grid-template-columns:1.05fr 1fr 1.55fr auto;gap:10px}
.cell{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px 13px;min-width:0;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .5s,border-color .5s}
.k{display:block;font:600 11px/1 var(--sans);letter-spacing:.12em;color:var(--ink2);margin-bottom:9px}
.depth .num{font:700 clamp(28px,5.2vw,38px)/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.depth .unit{font:600 15px/1 var(--mono);margin-left:4px;color:var(--ink2)}
.zone .zh{font:700 20px/1.1 var(--sans)}
.zone .en{display:block;margin-top:6px;font:600 10.5px/1.2 var(--mono);letter-spacing:.16em;color:var(--ink2)}
.zone .bar{position:relative;height:4px;border-radius:2px;background:var(--chip);margin-top:10px;overflow:hidden}
.zone .bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);border-radius:2px}
.music .title{font:700 17px/1.2 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music .meta{display:flex;align-items:center;gap:8px;margin-top:6px;font:600 11px/1 var(--mono);color:var(--ink2);flex-wrap:wrap}
.chords{display:inline-flex;gap:3px}
.chords b{font-weight:600;padding:3px 5px;border-radius:5px;transition:background .15s,color .15s}
.chords b.on{background:var(--accent);color:var(--accent-ink)}
.beats{display:inline-flex;gap:3px}
.beats i{width:5px;height:5px;border-radius:50%;background:var(--ink2);opacity:.28;transition:opacity .1s}
.beats i.on{opacity:1}
.layers{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.layers i{font:600 11px/1 var(--sans);font-style:normal;padding:4px 7px;border-radius:999px;border:1px solid var(--line);
  color:var(--ink);opacity:.32;transition:opacity .25s,background .25s}
.layers i.on{background:var(--chip);opacity:1}
.sound{appearance:none;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-width:96px;text-align:center}
.sound:hover{border-color:var(--ink2)}
.sound:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sound svg{width:26px;height:26px}
.sound .lbl{font:700 14px/1 var(--sans)}
.sound .vol{font:600 11px/1 var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums}
.sound[aria-pressed="false"] .wave{display:none}
.sound[aria-pressed="true"] .mute{display:none}
.hint{margin:0;font:500 12px/1.5 var(--sans);color:var(--ink2);text-align:center;min-height:18px;transition:opacity .4s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:640px){
  .stage{gap:14px}
  .readout{grid-template-columns:1fr 1fr;grid-template-areas:"d z" "m m" "s s";gap:8px}
  .depth{grid-area:d}.zone{grid-area:z}.music{grid-area:m}
  .sound{grid-area:s;flex-direction:row;min-height:46px;gap:10px;padding:10px 14px}
  .zone .zh{font-size:18px}
  .ruler{font-size:10px}
}
@media (max-height:520px) and (orientation:landscape){
  header{display:none}
  .stage{gap:10px}
}
@media (prefers-reduced-motion:reduce){ .rays{animation:none} }
</style>
</head>
<body>
<div class="rays" aria-hidden="true"></div>
<main class="stage">
  <header>
    <p class="eyebrow">Deep Dive Switch</p>
    <h1>音量潜水球 <span class="glass">· 0 → 6,000 m</span></h1>
  </header>

  <div class="slider-wrap">
    <div id="slider" class="slider" role="slider" tabindex="0"
         aria-label="音量与下潜深度" aria-valuemin="0" aria-valuemax="6000" aria-valuenow="0" aria-valuetext="0 米，海面">
      <canvas id="view" width="752" height="248"></canvas>
    </div>
    <div class="ruler" id="ruler" aria-hidden="true"></div>
  </div>

  <section class="readout" aria-live="off">
    <div class="cell depth">
      <span class="k">深度</span>
      <span class="num" id="depthNum">0</span><span class="unit">m</span>
    </div>
    <div class="cell zone">
      <span class="k">海洋分区</span>
      <span class="zh" id="zoneZh">海面</span>
      <span class="en" id="zoneEn">SEA SURFACE</span>
      <div class="bar"><i id="zoneBar"></i></div>
    </div>
    <div class="cell music">
      <span class="k">当前音乐</span>
      <div class="title" id="trackName">浪尖摇篮</div>
      <div class="meta">
        <span>D 小调 · 84 BPM</span>
        <span class="chords" id="chords"><b>Dm</b><b>B♭</b><b>Gm</b><b>A</b></span>
        <span class="beats" id="beats"><i></i><i></i><i></i><i></i></span>
      </div>
      <div class="layers" id="layers">
        <i data-l="waves">海浪</i><i data-l="kalimba">卡林巴</i><i data-l="bass">低音节奏</i><i data-l="whale">鲸声</i><i data-l="sonar">声呐</i><i data-l="drone">深海低鸣</i>
      </div>
    </div>
    <button class="cell sound" id="soundBtn" type="button" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor" fill-opacity=".14"/>
        <path class="wave" d="M15.5 9.2a4 4 0 0 1 0 5.6M18.2 6.6a7.6 7.6 0 0 1 0 10.8"/>
        <path class="mute" d="M16 9.5l5 5M21 9.5l-5 5"/>
      </svg>
      <span class="lbl" id="soundLbl">声音 开</span>
      <span class="vol" id="volLbl">音量 35%</span>
    </button>
  </section>
  <p class="hint" id="hint">轻触潜水球或轨道开启声音 · 也可用 ← → / Home / End</p>
  <p class="sr" id="live" aria-live="polite"></p>
</main>
<script>
'use strict';
/* ============================================================
   Deep Dive Switch —— 常量、工具、像素缓冲区
   轨道是 176×50 的像素海洋剖面：横轴从左到右就是下潜深度
   ============================================================ */
const W = 176, H = 50, PAD = 6, FULLW = W + PAD * 2, FULLH = H + PAD * 2;
const KX0 = 38, KX1 = 153, KY = 25, KR = 21;          // 旋钮中心可移动范围（轨道像素）与半径
const N = W * H;
const ALB = new Float32Array(N * 3);   // 反照率：被环境光 / 探照灯照亮的颜色
const EMI = new Float32Array(N * 3);   // 自发光：水色、天空、生物荧光
const PIX = new Uint8Array(N * 4);     // 上传给 WebGL 的 RGBA8
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const hash = (x, y) => { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = rng(20261122);
const hex = s => [parseInt(s.slice(1, 3), 16) / 255, parseInt(s.slice(3, 5), 16) / 255, parseInt(s.slice(5, 7), 16) / 255];
function grad(stops, v) {
  if (v <= stops[0][0]) return stops[0][1].slice();
  for (let i = 1; i < stops.length; i++) if (v <= stops[i][0]) {
    const [a, ca] = stops[i - 1], [b, cb] = stops[i], t = (v - a) / (b - a);
    return [lerp(ca[0], cb[0], t), lerp(ca[1], cb[1], t), lerp(ca[2], cb[2], t)];
  }
  return stops[stops.length - 1][1].slice();
}

/* 滑杆值 v ∈ [0,1] ↔ 深度（米）。浅海给更多行程 */
const DK = [[0, 0], [0.28, 200], [0.52, 1000], [0.78, 4000], [1, 6000]];
function depthOf(v) {
  v = clamp(v, 0, 1);
  for (let i = 1; i < DK.length; i++) if (v <= DK[i][0]) {
    const [v0, d0] = DK[i - 1], [v1, d1] = DK[i];
    return d0 + (d1 - d0) * (v - v0) / (v1 - v0);
  }
  return 6000;
}
const xOfV = v => KX0 + v * (KX1 - KX0);
const vOfX = x => (x - KX0) / (KX1 - KX0);
const volumeOf = v => 0.35 + 0.65 * clamp(v, 0, 1);

const ZONES = [
  { max: 1, zh: '海面', en: 'SEA SURFACE', track: '浪尖摇篮' },
  { max: 200, zh: '透光层', en: 'SUNLIGHT ZONE · 0–200 M', track: '珊瑚光斑' },
  { max: 1000, zh: '弱光层', en: 'TWILIGHT ZONE · 200–1,000 M', track: '水母灯会' },
  { max: 4000, zh: '午夜层', en: 'MIDNIGHT ZONE · 1,000–4,000 M', track: '鲸歌与声呐' },
  { max: 1e9, zh: '深渊层', en: 'ABYSSAL ZONE · 4,000–6,000 M', track: '深渊低鸣' },
];
const zoneOf = d => ZONES.find(z => d < z.max);

/* 每种声部随深度的音量（0..1），音频和界面共用 */
function layerLevels(d) {
  return {
    waves: 1 - smooth(0, 140, d),
    kalimba: 1 - smooth(380, 1150, d),
    bass: smooth(50, 380, d) * (1 - smooth(3400, 5500, d)),
    whale: smooth(650, 1250, d) * (1 - smooth(2700, 3700, d)),
    sonar: smooth(1500, 2500, d) * (1 - 0.4 * smooth(4800, 5900, d)),
    drone: smooth(2300, 5200, d),
  };
}

/* ---------- 剖面地形（静态） ---------- */
const COLV = new Float32Array(W), COLD = new Float32Array(W), AMB = new Float32Array(W);
const YW = new Float32Array(W), FLOOR = new Float32Array(W), WY = new Int16Array(W);
const WATER = new Float32Array(W * 3);
const WSTOPS = [[-0.4, [92, 216, 222]], [0, [66, 196, 207]], [0.14, [38, 158, 188]], [0.28, [24, 112, 156]], [0.4, [15, 74, 120]],
  [0.52, [10, 46, 86]], [0.65, [7, 29, 60]], [0.78, [5, 18, 40]], [0.9, [3, 11, 25]], [1.2, [2, 6, 14]]].map(([v, c]) => [v, c.map(k => k / 255)]);
for (let x = 0; x < W; x++) {
  const v = vOfX(x + 0.5), d = v <= 0 ? 0 : depthOf(v) + (v > 1 ? (v - 1) * 2000 : 0);
  COLV[x] = v; COLD[x] = d; AMB[x] = Math.exp(-d / 260);
  const c = grad(WSTOPS, v); WATER[x * 3] = c[0]; WATER[x * 3 + 1] = c[1]; WATER[x * 3 + 2] = c[2];
  YW[x] = 25 - 28 * smooth(42, 68, x);                     // 水面线：往右弯出画面
  let shelf = 45.6 + Math.sin(x * 0.31) * 1.1 + Math.sin(x * 0.83 + 1) * 0.6;
  if (x < 6) shelf += 0.3 * (6 - x);
  if (x > 73) shelf += Math.pow((x - 73) * 0.5, 1.8);       // 大陆坡
  let abyss = 44.2 + 13 * (1 - smooth(122, 143, x)) + Math.sin(x * 0.47) * 0.8 + Math.sin(x * 1.31) * 0.4;
  FLOOR[x] = Math.min(shelf, abyss);
}

/* ---------- 像素写入 ---------- */
function px(x, y, c, k = 1) {               // 不透明、受光照
  x = Math.floor(x); y = Math.floor(y);
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = (y * W + x) * 3;
  ALB[i] = c[0] * k; ALB[i + 1] = c[1] * k; ALB[i + 2] = c[2] * k; EMI[i] = EMI[i + 1] = EMI[i + 2] = 0;
}
function glow(x, y, c, a = 1) {             // 叠加自发光
  x = Math.floor(x); y = Math.floor(y);
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = (y * W + x) * 3;
  EMI[i] += c[0] * a; EMI[i + 1] += c[1] * a; EMI[i + 2] += c[2] * a;
}
function paint(x, y, c, a = 1) {            // 自发光覆盖（天空里的白云、浪花）
  x = Math.floor(x); y = Math.floor(y);
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = (y * W + x) * 3;
  EMI[i] = lerp(EMI[i], c[0], a); EMI[i + 1] = lerp(EMI[i + 1], c[1], a); EMI[i + 2] = lerp(EMI[i + 2], c[2], a);
  ALB[i] *= 1 - a; ALB[i + 1] *= 1 - a; ALB[i + 2] *= 1 - a;
}
function shade(x, y, k) {                    // 剪影：压暗
  x = Math.floor(x); y = Math.floor(y);
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = (y * W + x) * 3;
  EMI[i] *= k; EMI[i + 1] *= k; EMI[i + 2] *= k; ALB[i] *= k; ALB[i + 1] *= k; ALB[i + 2] *= k;
}
function halo(cx, cy, rad, c, a) {           // 有序抖动的光晕
  for (let y = Math.floor(cy - rad); y <= cy + rad; y++) for (let x = Math.floor(cx - rad); x <= cx + rad; x++) {
    if (x < 0 || y < 0 || x >= W || y >= H) continue;
    const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy) / rad;
    if (d >= 1) continue;
    const f = (1 - d) * (1 - d);
    if (BAYER[(y & 3) * 4 + (x & 3)] < f * 1.15) glow(x, y, c, a * (0.55 + 0.45 * f));
  }
}

/* ---------- 精灵：字符画 + 调色板。模式 0 受光，1 自发光 ---------- */
function sprite(rows, pal) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length)), grid = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x]; grid.push(ch && ch !== '.' && pal[ch] ? pal[ch] : null);
  }
  return { w, h, grid };
}
const P = (h, mode = 0) => ({ c: hex(h), mode });
// 绘制：x0,y0 为左上角；sx 是横向缩放（转身动画），flip 水平翻转
function drawSprite(s, x0, y0, flip = false, sx = 1, k = 1) {
  const dw = Math.max(1, Math.round(s.w * sx)), off = Math.round((s.w - dw) / 2);
  for (let y = 0; y < s.h; y++) for (let dx = 0; dx < dw; dx++) {
    let sxi = Math.min(s.w - 1, Math.floor((dx + 0.5) / sx));
    if (flip) sxi = s.w - 1 - sxi;
    const p = s.grid[y * s.w + sxi];
    if (!p) continue;
    if (p.mode === 1) paint(x0 + off + dx, y0 + y, p.c, 1);
    else px(x0 + off + dx, y0 + y, p.c, k);
  }
}

/* ============================================================
   精灵与场景对象
   ============================================================ */
const SPR = {
  boat: sprite([
    '.......r.......',
    '.......mr......',
    '......wm.......',
    '.....wwm.......',
    '....wwwms......',
    '...wwwwmss.....',
    '..wwwwwmsss....',
    '.wwwwwwmssss...',
    'wwwwwwwmsssss..',
    '.......m.......',
    'hhhhhhhhhhhhhhh',
    '.hHhhhhhhhhhhh.',
    '..kkkkkkkkkkk..',
  ], { r: P('#e2483d'), m: P('#6b4a2e'), w: P('#fbfbf4'), s: P('#d9e4e8'), h: P('#c8513c'), H: P('#f4e9c8'), k: P('#4a2e22') }),
  cloud: sprite([
    '....wwww.....',
    '..wwwwwwww...',
    '.wwwwwwwwwwww',
    '..ggggggggg..',
  ], { w: P('#ffffff', 1), g: P('#d6eef6', 1) }),
  turtleA: sprite([
    '..ff........',
    '...GgGgG....',
    '..GgGgGgG.ss',
    '.GgGgGgGgsse',
    '..bbbbbbb.ss',
    '.ff....ff...',
  ], { G: P('#3d6b3a'), g: P('#78a04a'), b: P('#c7c08a'), s: P('#8fb86a'), e: P('#12210f'), f: P('#6f9e57') }),
  turtleB: sprite([
    '............',
    '.ffGgGgG....',
    '..GgGgGgG.ss',
    '.GgGgGgGgsse',
    '..bbbbbbb.ss',
    '...ff...ff..',
  ], { G: P('#3d6b3a'), g: P('#78a04a'), b: P('#c7c08a'), s: P('#8fb86a'), e: P('#12210f'), f: P('#6f9e57') }),
  fishY: sprite([
    't.bb.',
    'tbbbe',
    't.bb.',
  ], { t: P('#f0a020'), b: P('#ffd23f'), e: P('#2b2b2b') }),
  fishB: sprite([
    't.bb.',
    'tbBbe',
    't.bb.',
  ], { t: P('#2d7fbf'), b: P('#5ec6ff'), B: P('#f6fbff'), e: P('#13283a') }),
  lantern: sprite([
    'tbbbe',
    '.bbb.',
  ], { t: P('#4a5566'), b: P('#7d8aa0'), e: P('#c9d6ea') }),
  // 鮟鱇鱼：面朝右
  anglerC: sprite([
    '.......BBBBB.....',
    '.....BBBDBBBBB...',
    'T..BBBBBBBBBBBB..',
    'TT.BBDBBBBBBBWPB.',
    'TTBBBBBBBDBBBBBBB',
    'TTBBBBBBBBBBttttt',

/* 珊瑚、海藻、岩石（静态布局，绘制时摇摆） */
const CORAL_COLS = ['#ff6f8e', '#ff9a4d', '#c77dff', '#ff5d5d', '#ffd166', '#5ad1c8', '#f78fd4'].map(hex);
const corals = [];
for (let x = 3; x < 74; x += 2 + Math.floor(rand() * 4)) {
  const r = rand(), type = x < 12 ? 'kelp' : r < 0.3 ? 'branch' : r < 0.5 ? 'fan' : r < 0.66 ? 'brain' : r < 0.8 ? 'tube' : r < 0.9 ? 'anemone' : 'kelp';
  const c = CORAL_COLS[Math.floor(rand() * CORAL_COLS.length)];
  corals.push({ x, type, c, c2: c.map(k => k * 0.7), h: type === 'kelp' ? 9 + Math.floor(rand() * 9) : 4 + Math.floor(rand() * 6), ph: rand() * 6.28 });
}
const rocks = [];
for (let x = 126; x < W; x += 4 + Math.floor(rand() * 7)) rocks.push({ x, w: 2 + Math.floor(rand() * 4), h: 1 + Math.floor(rand() * 3), sponge: rand() < 0.3 });

/* 动态对象 */
const fish = [];
for (let i = 0; i < 15; i++) fish.push({ x: 54 + rand() * 18, y: 26 + rand() * 12, vx: 8 + rand() * 4, vy: (rand() - 0.5) * 4, panic: 0, kind: i % 4 === 0 ? 1 : 0 });
const jellies = [
  { x: 79, y: 20, c: hex('#ff7ccf'), ph: 0.0, flash: 0, note: 0 },
  { x: 86, y: 32, c: hex('#a98bff'), ph: 1.7, flash: 0, note: 1 },
  { x: 93, y: 16, c: hex('#5ee6ff'), ph: 3.1, flash: 0, note: 2 },
  { x: 100, y: 29, c: hex('#ff9f7a'), ph: 4.4, flash: 0, note: 3 },
];
const lanterns = [];
for (let i = 0; i < 10; i++) lanterns.push({ x: 104 + rand() * 34, y: 8 + rand() * 32, vx: (rand() - 0.5) * 4, vy: 0, ph: rand() * 6.28, next: rand() * 3 });
const snow = [];
for (let i = 0; i < 90; i++) snow.push({ x: 86 + rand() * 92, y: rand() * H, vy: 1.2 + rand() * 2.4, ph: rand() * 6.28, b: 0.5 + rand() * 0.5 });
const gulls = [{ cx: 24, cy: 8, r: 9, w: 0.55, ph: 0 }, { cx: 40, cy: 5, r: 6, w: -0.42, ph: 2 }, { cx: 15, cy: 11, r: 5, w: 0.7, ph: 4 }];
const bubbles = [], drops = [], gold = [];
const turtle = { x: 52, y: 30, f: 1 };

const S = {                         // 全局状态
  t: 0, tv: 0, v: 0, vel: 0, st: 0, stv: 0, press: 0,
  kx: KX0, ky: KY, depth: 0, drag: false, grabOff: 0,
  lamp: 0, lampBase: 0, lampOn: false, lampT: -9,
  angF: 1, angMouth: 0, angNear: false,
  chestT: 0, chestOpen: false, chestArmed: true,
  surfaced: true, bubbleT: 0, focus: false,
};
const LIGHTS = [];                  // 每帧收集的点光源 {x,y,c,rad,k}

/* ============================================================
   场景更新：鱼群、海龟、水母、灯笼鱼、海雪、粒子
   ============================================================ */
const cx = x => clamp(Math.floor(x), 0, W - 1);

function spawnSplash(x, n) {
  for (let i = 0; i < n; i++) drops.push({ x: x + (rand() - 0.5) * 14, y: KY - 0.5, vx: (rand() - 0.5) * 26, vy: -16 - rand() * 30, life: 1.4 });
  for (let i = 0; i < n; i++) bubbles.push({ x: x + (rand() - 0.5) * 18, y: KY + 2 + rand() * 14, vy: -6 - rand() * 10, ph: rand() * 6, life: 0.8 + rand() * 1.4 });
}
function spawnGold(n) {
  for (let i = 0; i < n; i++) gold.push({ x: 163 + (rand() - 0.5) * 7, y: FLOOR[163] - 6, vx: (rand() - 0.5) * 22, vy: -22 - rand() * 26, life: 1.6 + rand() * 1.4, ph: rand() * 6 });
}

function updateScene(dt, t) {
  const kx = S.kx, ky = S.ky;
  for (let x = 0; x < W; x++) WY[x] = Math.round(YW[x] + Math.sin(x * 0.45 + t * 2.2) * 0.6 + Math.sin(x * 0.17 - t * 1.3) * 0.5);

  /* 鱼群：boids + 被潜水球惊散 */
  let hx = 50 + 9 * Math.sin(t * 0.21), hy = 32 + 5 * Math.sin(t * 0.33);
  let meanX = 0; for (const f of fish) meanX += f.x; meanX /= fish.length;
  if (Math.abs(kx - hx) < 30) hx = clamp(meanX >= kx ? kx + 30 : kx - 30, 12, 72);   // 往自己所在的一侧逃开潜水球
  for (const f of fish) {
    let ax = 0, ay = 0, n = 0, mx = 0, my = 0, ux = 0, uy = 0;
    for (const g of fish) {
      if (g === f) continue;
      const dx = g.x - f.x, dy = g.y - f.y, d2 = dx * dx + dy * dy;
      if (d2 < 110) { n++; mx += g.x; my += g.y; ux += g.vx; uy += g.vy; if (d2 < 10) { ax -= dx / (d2 + 0.3) * 16; ay -= dy / (d2 + 0.3) * 16; } }
    }
    if (n) { ax += (mx / n - f.x) * 0.7 + (ux / n - f.vx) * 0.9; ay += (my / n - f.y) * 0.7 + (uy / n - f.vy) * 0.9; }
    ax += (hx - f.x) * 0.32; ay += (hy - f.y) * 0.3;
    const dx = f.x - kx, dy = f.y - ky, kd = Math.hypot(dx, dy) + 0.01, fr = KR + 10;
    if (kd < fr) { const k = (fr - kd) / fr; ax += dx / kd * k * 520 + S.vel * 900 * k; ay += dy / kd * k * 520; f.panic = 1; }
    f.panic = Math.max(0, f.panic - dt * 0.6);
    const top = WY[cx(f.x)] + 3, bot = FLOOR[cx(f.x)] - 3;
    if (f.y < top) ay += (top - f.y) * 40;
    if (f.y > bot) ay -= (f.y - bot) * 40;
    if (f.x < 12) ax += (12 - f.x) * 30;
    if (f.x > 72) ax -= (f.x - 72) * 30;
    f.vx += ax * dt; f.vy += ay * dt;
    const sp = Math.hypot(f.vx, f.vy) + 1e-3, mxs = 13 + f.panic * 34, mns = 5;
    if (sp > mxs) { f.vx *= mxs / sp; f.vy *= mxs / sp; } else if (sp < mns) { f.vx *= mns / sp; f.vy *= mns / sp; }
    f.x += f.vx * dt; f.y += f.vy * dt;
  }

  /* 海龟慢慢巡游 */
  const tx = 55 + 12 * Math.sin(t * 0.085), dtx = Math.cos(t * 0.085);
  turtle.x = tx; turtle.y = 34 + 3 * Math.sin(t * 0.13); turtle.f = dtx >= 0 ? 1 : -1;

  /* 水母：经过时闪光并发声 */
  for (const j of jellies) j.flash = Math.max(0, j.flash - dt * 0.9);

  /* 灯笼鱼：悬停 + 突然窜动 */
  for (const l of lanterns) {
    l.next -= dt;
    if (l.next <= 0) { l.next = 1.2 + rand() * 3; const a = rand() * 6.28; l.vx = Math.cos(a) * 16; l.vy = Math.sin(a) * 6; }
    const dx = l.x - kx, dy = l.y - ky, kd = Math.hypot(dx, dy) + 0.01;
    if (kd < KR + 6 && S.lamp > 0.3) { l.vx += dx / kd * 40 * dt * 6; l.vy += dy / kd * 20 * dt * 6; }
    l.vx *= Math.exp(-dt * 1.6); l.vy *= Math.exp(-dt * 1.6);
    l.x += l.vx * dt; l.y += (l.vy + Math.sin(t * 0.9 + l.ph) * 0.8) * dt;
    if (l.x < 102) l.vx += 30 * dt; if (l.x > 142) l.vx -= 30 * dt;
    if (l.y < 6) l.vy += 20 * dt; if (l.y > 40) l.vy -= 20 * dt;
  }

  /* 海雪 */
  for (const s of snow) {
    s.y += s.vy * dt; s.x += Math.sin(t * 0.5 + s.ph) * 0.8 * dt;
    if (s.y > H) { s.y -= H + 1; s.x = 86 + rand() * 92; }
  }

  /* 潜水球冒出的气泡 */
  if (S.depth > 1) {
    S.bubbleT -= dt;
    const speed = Math.abs(S.vel);
    if (S.bubbleT <= 0 && (speed > 0.03 || rand() < dt * 1.5)) {
      S.bubbleT = speed > 0.03 ? 0.05 / Math.min(4, speed * 6) : 0.4;
      const side = S.vel > 0 ? -1 : 1;
      bubbles.push({ x: kx + side * (KR - 3) * (0.5 + rand() * 0.5), y: ky - 4 + (rand() - 0.5) * 22, vy: -7 - rand() * 7, ph: rand() * 6, life: 1.6 + rand() * 1.6 });
    }
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i]; b.life -= dt; b.y += b.vy * dt; b.x += Math.sin(S.t * 6 + b.ph) * 4 * dt;
    if (b.life <= 0 || b.y < WY[cx(b.x)] + 1 || b.y < -1) bubbles.splice(i, 1);
  }
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i]; d.life -= dt; d.vy += 70 * dt; d.x += d.vx * dt; d.y += d.vy * dt;
    if (d.life <= 0 || (d.vy > 0 && d.y > WY[cx(d.x)] + 1)) drops.splice(i, 1);
  }

  /* 鮟鱇鱼：靠近时转身张嘴 */
  const adx = kx - 140;
  const near = Math.abs(adx) < 24;
  const faceT = near ? (Math.abs(adx) > 2 ? Math.sign(adx) : Math.sign(S.angF) || 1) : 1;
  S.angF += clamp(faceT - S.angF, -dt * 4.5, dt * 4.5);
  S.angMouth += clamp((Math.abs(adx) < 17 ? 1 : 0) - S.angMouth, -dt * 3, dt * 5);

  /* 宝箱 */
  S.chestT += clamp((S.chestOpen ? 1 : 0) - S.chestT, -dt * 1.2, dt * 2.2);
  if (S.chestOpen && S.chestT > 0.6 && rand() < dt * 9) spawnGold(1);
  for (let i = gold.length - 1; i >= 0; i--) {
    const g = gold[i]; g.life -= dt; g.vy += 30 * dt; g.vx *= Math.exp(-dt * 0.8); g.x += g.vx * dt; g.y += g.vy * dt;
    if (g.y > FLOOR[cx(g.x)] - 1) { g.y = FLOOR[cx(g.x)] - 1; g.vy *= -0.35; g.vx *= 0.6; }
    if (g.life <= 0) gold.splice(i, 1);
  }
}

/* ============================================================
   逐帧重绘像素剖面
   ============================================================ */
const SKY_TOP = hex('#7fd0ef'), SKY_LOW = hex('#e4f8f8'), SUN = hex('#fff2b0');
const FOAM = hex('#f2fdff'), CREST = hex('#a8ecf0');
const SAND = hex('#e8d49a'), SAND2 = hex('#c9b27a'), ROCK = hex('#6b7280'), SILT = hex('#5b5a6e'), SILT2 = hex('#434257');
const KELP = hex('#3f9a54'), KELP2 = hex('#6cc46a');
const WHITE = [1, 1, 1], GOLD = hex('#ffcf4a');

function drawBackground(t) {
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 3;
    ALB[i] = ALB[i + 1] = ALB[i + 2] = 0;
    if (y < WY[x]) {                                       // 天空
      const k = clamp(y / 24, 0, 1);
      const sd = Math.hypot(x - 7, y - 5);
      const sg = Math.max(0, 1 - sd / 14) * 0.35;
      EMI[i] = lerp(SKY_TOP[0], SKY_LOW[0], k) + sg; EMI[i + 1] = lerp(SKY_TOP[1], SKY_LOW[1], k) + sg * 0.9; EMI[i + 2] = lerp(SKY_TOP[2], SKY_LOW[2], k) + sg * 0.5;
    } else {                                               // 海水
      const a = AMB[x], vy = y / H, lift = (1 - vy) * 0.2 * a, dk = 1 - vy * 0.2;
      EMI[i] = (WATER[x * 3] + lift * 0.5) * dk; EMI[i + 1] = (WATER[x * 3 + 1] + lift) * dk; EMI[i + 2] = (WATER[x * 3 + 2] + lift * 0.9) * dk;
      ALB[i] = 0.14; ALB[i + 1] = 0.2; ALB[i + 2] = 0.24;  // 水体散射：探照灯扫过时发亮
    }
  }
  // 太阳
  for (let y = 1; y < 10; y++) for (let x = 2; x < 13; x++) { const d = Math.hypot(x + 0.5 - 7, y + 0.5 - 5); if (d < 3.3 && y < WY[x]) paint(x, y, SUN, 1); }
  // 云
  for (const [ox, oy, sp] of [[4, 1, 1.3], [33, 3, 0.8]]) {
    const x0 = ((ox + t * sp) % 78) - 14, s = SPR.cloud;
    for (let y = 0; y < s.h; y++) for (let x = 0; x < s.w; x++) {
      const p = s.grid[y * s.w + x], X = Math.floor(x0 + x), Y = oy + y;
      if (p && X >= 0 && X < W && Y < WY[X] - 1) paint(X, Y, p.c, 0.92);
    }
  }
}

function drawWhale(t) {                                    // 远处的鲸影：只压暗水色
  const ph = t * 0.045, wx = 118 + 15 * Math.sin(ph), wy = 13 + 2 * Math.sin(t * 0.11), f = Math.cos(ph) >= 0 ? 1 : -1;
  const flex = Math.sin(t * 0.9);
  for (let s = -18; s <= 16; s++) {
    let half, cy = wy;
    if (s >= 4) half = 4.8 * Math.sqrt(Math.max(0, 1 - Math.pow((s - 4) / 12.5, 2)));
    else if (s >= -12) half = 1 + 3.8 * smooth(-12, 4, s);
    else half = 0;
    if (s < -3) cy += flex * 1.8 * Math.pow((-3 - s) / 15, 1.5);
    const X = Math.round(wx + s * f);
    if (half > 0) for (let y = Math.round(cy - half); y <= Math.round(cy + half * 0.9); y++) shade(X, y, 0.58);
    if (s < -12) { const span = (-12 - s) * 0.85 + 0.5; for (let y = Math.round(cy - span); y <= Math.round(cy + span); y++) if (Math.abs(y - cy) > span - 2.2) shade(X, y, 0.6); }
    if (s <= 4 && s >= -2) { const fy = Math.round(wy + 3 + (4 - s) * 0.7); shade(X, fy, 0.62); shade(X, fy + 1, 0.66); }
  }
}

function drawFloor(t) {
  for (let x = 0; x < W; x++) {
    const fy = FLOOR[x]; if (fy >= H) continue;
    const shallow = x < 100, a = AMB[x];
    for (let y = Math.max(0, Math.ceil(fy)); y < H; y++) {
      const dd = y - fy, h = hash(x, y);
      let c;
      if (shallow) {
        c = x > 72 ? ROCK : (dd < 1 ? SAND : SAND2);
        let k = 0.9 + h * 0.18;
        if (dd < 3 && x < 74) {                             // 水底焦散
          const cst = Math.max(0, Math.sin(x * 0.9 + t * 1.7 + Math.sin(y * 1.3 + t)) * Math.sin(x * 0.37 - t * 1.1 + y * 0.5));
          k += cst * 0.7 * a;
        }
        px(x, y, c, k);
      } else {
        c = h < 0.2 ? SILT2 : SILT;
        px(x, y, c, dd < 1 ? 1.15 : 0.85 + h * 0.15);
      }
    }
  }
  // 深海岩石与玻璃海绵
  for (const r of rocks) {
    const fy = Math.floor(FLOOR[r.x]);
    for (let i = 0; i < r.w; i++) for (let j = 0; j < r.h - (i === 0 || i === r.w - 1 ? 1 : 0); j++) px(r.x + i, fy - 1 - j, SILT2, 1 + j * 0.15);
    if (r.sponge) for (let j = 0; j < 5; j++) px(r.x + 1 + Math.round(Math.sin(t * 0.7 + r.x + j * 0.4) * 0.4 * j / 5), fy - r.h - j, [0.85, 0.88, 0.9], 0.9);
  }
}

function drawCorals(t) {
  for (const c of corals) {
    const fy = Math.floor(FLOOR[c.x]);
    if (fy >= H + 2) continue;
    const sw = k => Math.round(Math.sin(t * 1.3 + c.ph + k * 0.25) * 0.9 * k / c.h);
    switch (c.type) {
      case 'kelp':
        for (let k = 0; k < c.h; k++) {
          const xo = Math.round(Math.sin(t * 0.9 + c.ph + k * 0.24) * 2.2 * k / c.h);
          px(c.x + xo, fy - k, KELP);
          if (k % 3 === 1) px(c.x + xo + (k % 2 ? 1 : -1), fy - k, KELP2);
        }
        break;
      case 'branch':
        for (let k = 0; k < c.h; k++) {
          const s = sw(k); px(c.x + s, fy - k, c.c);
          if (k > 1 && k % 2 === 0) { const d = (k / 2) % 2 ? 1 : -1; px(c.x + s + d, fy - k - 1, c.c); if (k < c.h - 2) px(c.x + s + d * 2, fy - k - 2, c.c, 1.2); }
        }
        px(c.x + sw(c.h), fy - c.h, c.c, 1.3);
        break;
      case 'fan':
        for (let k = 0; k < c.h; k++) {
          const w = Math.round(k / c.h * 3.4), s = sw(k);
          for (let d = -w; d <= w; d++) if ((d + k) % 2 === 0 || Math.abs(d) === w) px(c.x + s + d, fy - k, k === 0 ? c.c2 : c.c);
        }
        break;
      case 'brain': {
        const r = 2 + (c.h % 3);
        for (let d = -r; d <= r; d++) { const hh = Math.round(Math.sqrt(r * r - d * d) * 0.75); for (let k = 0; k <= hh; k++) px(c.x + d, fy - k, (d + k + 9) % 3 ? c.c : c.c2); }
        break;
      }
      case 'tube':
        for (const [d, hh] of [[-1, c.h - 1], [1, c.h], [3, c.h - 3]]) for (let k = 0; k < hh; k++) px(c.x + d, fy - k, k === hh - 1 ? [1, 0.9, 0.7] : c.c, k === hh - 1 ? 1 : 0.9);
        break;
      case 'anemone':
        px(c.x, fy, c.c2); px(c.x + 1, fy, c.c2); px(c.x - 1, fy, c.c2);
        for (let a = -2; a <= 2; a++) for (let k = 1; k < 4; k++) px(c.x + a + Math.round(Math.sin(t * 2 + c.ph + a) * 0.6 * k / 3) + (k > 1 ? Math.sign(a) : 0), fy - k, c.c, 1.1);
        break;
    }
  }
}

function drawLife(t) {
  // 海龟
  const ts = Math.floor(t * 2.2) % 2 ? SPR.turtleA : SPR.turtleB;
  drawSprite(ts, Math.round(turtle.x - 6), Math.round(turtle.y - 3), turtle.f < 0);
  // 鱼群
  for (const f of fish) drawSprite(f.kind ? SPR.fishB : SPR.fishY, Math.round(f.x - 2), Math.round(f.y - 1), f.vx < 0);
  // 水母
  for (const j of jellies) {
    const y0 = j.y + 3.5 * Math.sin(t * 0.35 + j.ph), pul = 0.5 + 0.5 * Math.sin(t * 2.6 + j.ph);
    const br = (0.7 + 0.3 * pul) * (1 + 1.6 * j.flash), w = 2 + Math.round(pul), X = Math.round(j.x), Y = Math.round(y0);
    halo(j.x + 0.5, y0 + 2, 6 + j.flash * 4, j.c, 0.16 * br);
    for (let dx = -w + 1; dx <= w - 1; dx++) paint(X + dx, Y, j.c.map(v => Math.min(1, v * br * 1.1)), 0.95);
    for (let dx = -w; dx <= w; dx++) { paint(X + dx, Y + 1, j.c.map(v => Math.min(1, v * br)), 0.9); paint(X + dx, Y + 2, j.c.map(v => v * br * 0.75), 0.85); }
    glow(X, Y, WHITE, 0.25 * br);
    for (let k = -2; k <= 2; k += k === -2 || k === 1 ? 2 : 1) {
      const L = 5 + ((k + 7) % 3);
      for (let s = 1; s <= L; s++) glow(X + k + Math.round(Math.sin(t * 2 + s * 0.6 + k) * 0.8 * s / L), Y + 2 + s, j.c, (1 - s / (L + 1)) * 0.55 * br);
    }
    LIGHTS.push({ x: j.x, y: y0 + 2, c: j.c, rad: 9, k: 0.35 * br });
  }
  // 灯笼鱼
  for (const l of lanterns) {
    const X = Math.round(l.x - 2), Y = Math.round(l.y), fl = l.vx < 0;
    drawSprite(SPR.lantern, X, Y, fl);
    const blink = 0.55 + 0.45 * Math.sin(t * 4 + l.ph);
    glow(X + (fl ? 3 : 1), Y + 1, [0.3, 0.85, 1], 0.9 * blink); glow(X + (fl ? 1 : 3), Y + 1, [0.3, 0.85, 1], 0.9 * blink);
    glow(X + (fl ? 0 : 4), Y, [0.6, 0.9, 1], 0.4);
  }
  // 海雪：自身微光，被灯照到会很亮
  for (const s of snow) {
    const X = Math.floor(s.x), Y = Math.floor(s.y);
    if (X < 0 || X >= W || Y < 0 || Y >= H || Y >= FLOOR[X]) continue;
    const vis = smooth(84, 104, X) * s.b;
    if (vis <= 0.02) continue;
    const i = (Y * W + X) * 3;
    ALB[i] += 0.8 * vis; ALB[i + 1] += 0.82 * vis; ALB[i + 2] += 0.8 * vis; glow(X, Y, [0.5, 0.6, 0.7], 0.12 * vis);
  }
}

function drawAbyss(t) {
  // 鮟鱇鱼
  const sp = S.angMouth > 0.5 ? SPR.anglerO : SPR.anglerC, sc = Math.max(0.18, Math.abs(S.angF)), fl = S.angF < 0;
  const ax = 140, ay = Math.round(31 + Math.sin(t * 0.8) * 0.7 + (S.angMouth > 0.5 ? Math.sin(t * 30) * 0.3 : 0));
  drawSprite(sp, ax - 8, ay, fl, sc);
  const map = sx => ax - 8 + Math.round((sp.w - sp.w * sc) / 2) + (fl ? (sp.w - 1 - sx) * sc : sx * sc);
  const lure = [[11, -1], [12, -2], [13, -3], [14, -3], [15, -2]];
  const bob = Math.round(Math.sin(t * 2.1) * 0.7);
  for (const [sx, sy] of lure) px(map(sx), ay + sy + (sx > 13 ? bob : 0), [0.42, 0.36, 0.3]);
  const lx = map(16) + 0.5, ly = ay - 1 + bob + 0.5, pulse = 0.75 + 0.25 * Math.sin(t * 3.3);
  halo(lx, ly, 5, [0.45, 1, 0.85], 0.35 * pulse);
  paint(lx, ly, [0.75, 1, 0.92], 1); glow(lx, ly, [0.4, 0.9, 0.8], 0.6 * pulse);
  LIGHTS.push({ x: lx, y: ly, c: [0.45, 1, 0.8], rad: 13, k: 0.9 * pulse });
  // 宝箱
  const bx = 157, by = Math.round(FLOOR[163]) - 2;
  const lift = Math.round(S.chestT * 3);
  if (S.chestT > 0.05) { drawSprite(SPR.chestInside, bx, by - 5); }
  drawSprite(SPR.chestLid, bx, by - 7 - lift, false, 1, 1 - S.chestT * 0.25);
  drawSprite(SPR.chestBase, bx, by - 4);
  if (S.chestT > 0.05) {
    halo(bx + 6, by - 7, 6 + S.chestT * 6, GOLD, 0.3 * S.chestT);
    LIGHTS.push({ x: bx + 6, y: by - 7, c: GOLD, rad: 18, k: 1.1 * S.chestT });
  }
}

function drawSurface(t) {
  // 浪线与浪花
  for (let x = 0; x < W; x++) {
    const y = WY[x]; if (y < 0 || y >= H) continue;
    const crest = Math.sin(x * 0.45 + t * 2.2) + Math.sin(x * 0.17 - t * 1.3) * 0.8;
    paint(x, y, crest > 0.9 ? FOAM : CREST, 0.95);
    if (crest > 1.35 && y > 0) paint(x, y - 1, FOAM, 0.7);
  }
  // 帆船随浪起伏（画在浪线之后，船身压在水面上）
  drawSprite(SPR.boat, 1, WY[8] - 11);
  // 船头浪花
  for (let k = 0; k < 3; k++) { const ph = (t * 1.7 + k * 0.33) % 1; paint(16 + ph * 4, WY[16] - 1 - Math.round(Math.sin(ph * 3.14) * 2), FOAM, 1 - ph); }
  // 海鸥
  for (const g of gulls) {
    const a = t * g.w + g.ph, X = Math.round(g.cx + Math.cos(a) * g.r), Y = Math.round(g.cy + Math.sin(a) * g.r * 0.3);
    const fr = [0, 1, 2, 1][Math.floor(t * 7 + g.ph) % 4], wc = [0.98, 0.98, 0.96], tip = [0.3, 0.33, 0.36];
    if (Y >= WY[cx(X)] - 1) continue;
    paint(X, Y, wc);
    if (fr === 0) { paint(X - 1, Y, wc); paint(X + 1, Y, wc); paint(X - 2, Y - 1, tip); paint(X + 2, Y - 1, tip); }
    else if (fr === 1) { paint(X - 1, Y, wc); paint(X + 1, Y, wc); paint(X - 2, Y, tip); paint(X + 2, Y, tip); }
    else { paint(X - 1, Y, wc); paint(X + 1, Y, wc); paint(X - 2, Y + 1, tip); paint(X + 2, Y + 1, tip); }
  }
}

function drawParticles(t) {
  for (const b of bubbles) { const a = Math.min(1, b.life); glow(b.x, b.y, [0.55, 0.75, 0.85], 0.55 * a); const i = (Math.floor(clamp(b.y, 0, H - 1)) * W + cx(b.x)) * 3; ALB[i] += 0.4; ALB[i + 1] += 0.5; ALB[i + 2] += 0.55; }
  for (const d of drops) paint(d.x, d.y, FOAM, Math.min(1, d.life * 1.5));
  for (const g of gold) { const tw = 0.6 + 0.4 * Math.sin(t * 14 + g.ph); paint(g.x, g.y, [1, 0.86, 0.38], Math.min(1, g.life) * tw); glow(g.x, g.y, [0.5, 0.35, 0.05], 0.4 * tw); }
}

/* 合成：反照率 × (环境光 + 点光源 + 探照灯[有序抖动]) + 自发光 + 光柱 */
function compose(t) {
  const lamp = S.lamp, sx = S.kx + 13, sy = S.ky + 3;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const j = y * W + x, i = j * 3, b = BAYER[(y & 3) * 4 + (x & 3)];
    const under = y >= WY[x];
    let a = under ? AMB[x] * (1 - 0.32 * y / H) : 1;
    let lr = a, lg = a, lb = a, beam = 0;
    for (const L of LIGHTS) {
      const d = Math.hypot(x + 0.5 - L.x, y + 0.5 - L.y);
      if (d >= L.rad) continue;
      const q = Math.floor((1 - d / L.rad) * (1 - d / L.rad) * L.k * 4 + b) / 4;
      lr += L.c[0] * q; lg += L.c[1] * q; lb += L.c[2] * q;
    }
    if (lamp > 0.004) {
      const dx = x + 0.5 - sx, dy = y + 0.5 - sy, d2 = dx * dx + dy * dy;
      let h = 0;
      if (dx > -4) { const ang = Math.abs(Math.atan2(dy, dx) - 0.17); h = smooth(0.62, 0.2, ang) * 1.35 / (1 + d2 / 650); }
      const dk = Math.hypot(x + 0.5 - S.kx, y + 0.5 - S.ky);
      h += 0.55 * Math.exp(-Math.max(0, dk - 14) / 6);
      const q = Math.floor(h * lamp * 5 + b) / 5;          // 5 级抖动衰减
      lr += q; lg += q * 0.94; lb += q * 0.8;
    }
    if (under && x > 30 && x < 100) {                        // 透光层光柱
      const u = x - y * 0.55;
      let s = Math.sin(u * 0.42 + t * 0.5) * Math.sin(u * 0.17 - t * 0.23 + 2);
      s = s > 0 ? s * s : 0;
      s *= AMB[x] * Math.exp(-(y - WY[x]) / 26) * smooth(32, 42, x);
      beam = Math.floor(s * 3.2 + b) / 3 * 0.2;
    }
    const r = ALB[i] * lr + EMI[i] + beam * 0.75, g = ALB[i + 1] * lg + EMI[i + 1] + beam * 0.95, bl = ALB[i + 2] * lb + EMI[i + 2] + beam;
    const o = j * 4;
    PIX[o] = r >= 1 ? 255 : r * 255; PIX[o + 1] = g >= 1 ? 255 : g * 255; PIX[o + 2] = bl >= 1 ? 255 : bl * 255; PIX[o + 3] = 255;
  }
}

function renderScene(t) {
  LIGHTS.length = 0;
  drawBackground(t);
  drawWhale(t);
  drawFloor(t);
  drawCorals(t);
  drawLife(t);
  drawAbyss(t);
  drawSurface(t);
  drawParticles(t);
  compose(t);
}

/* ============================================================
   WebGL2：最近邻放大的像素轨道 + 片元着色器玻璃潜水球
   ============================================================ */
const VS = `#version 300 es
in vec2 a;
void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;
const FS = `#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform vec2 uRes, uKnob, uStretch;
uniform float uScale, uPad, uR, uLamp, uDeep, uFocus, uTime;
out vec4 o;
const vec2 TS = vec2(176.0, 50.0);
const float MAG = 1.28;
float sdBox(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
vec3 T(vec2 q){ return texelFetch(uTex, ivec2(clamp(floor(q), vec2(0.0), TS - 1.0)), 0).rgb; }
vec4 over(vec4 top, vec4 bot){ return top + bot * (1.0 - top.a); }   // 预乘 alpha
void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uScale - uPad;
  float px = 1.0 / uScale;
  vec4 col = vec4(0.0);

  // 轨道投影
  float dS = sdBox(p - TS * 0.5 - vec2(0.0, 1.8), TS * 0.5, 5.0);
  col = vec4(0.0, 0.0, 0.0, (1.0 - smoothstep(-1.0, 5.0, dS)) * 0.26);

  // 轨道：texelFetch 最近邻采样，保留硬边像素
  float dT = sdBox(p - TS * 0.5, TS * 0.5, 5.0);
  if (dT < px) {
    vec3 c = T(p);
    float e = smoothstep(-5.0, 0.0, dT);
    c *= 1.0 - e * e * 0.42;                                  // 内阴影
    c += vec3(0.8, 0.95, 1.0) * smoothstep(-1.6, -0.4, dT) * step(p.y, 2.5) * 0.16;
    float a = clamp(0.5 - dT / px, 0.0, 1.0);
    col = over(vec4(c * a, a), col);
  }
  // 外框：上亮下暗
  float ring = (1.0 - smoothstep(0.0, 1.3, dT)) * smoothstep(-px, px, dT);
  vec3 rc = mix(vec3(1.0), vec3(0.0, 0.04, 0.08), smoothstep(8.0, 44.0, p.y));
  col = over(vec4(rc, 1.0) * ring * 0.5, col);

  // 潜水球投影
  vec2 k = p - uKnob;
  vec2 sd = (k - vec2(2.4, 3.8)) / uStretch;
  float sh = (1.0 - smoothstep(uR * 0.5, uR * 1.2, length(sd))) * mix(0.42, 0.24, uDeep);
  col = over(vec4(0.0, 0.0, 0.0, sh), col);

  // 潜水球
  vec2 ks = k / uStretch;
  float r = length(ks) / uR;
  float aaR = px / uR * 1.3;
  if (r < 1.0 + aaR) {
    float rr = min(r, 1.0);
    vec2 n2 = ks / uR;
    float z = sqrt(max(0.0, 1.0 - rr * rr));
    vec2 dir = n2 / max(rr, 1e-4);
    float bend = uR * 0.42 * pow(rr, 4.0);                   // 边缘折射
    vec2 base = uKnob + k / MAG;                              // 约 1.28 倍放大
    vec3 g;
    g.r = T(base + dir * bend * 0.90).r;                      // 色散
    g.g = T(base + dir * bend * 1.00).g;
    g.b = T(base + dir * bend * 1.13).b;
    vec3 c = g * vec3(0.95, 1.02, 1.05) * (1.03 + 0.07 * z);
    float thick = smoothstep(0.80, 0.98, rr);
    c = mix(c, c * 0.6 + vec3(0.02, 0.07, 0.1), thick * 0.55);
    float fres = pow(1.0 - z, 3.0);
    c += vec3(0.7, 0.92, 1.0) * fres * mix(0.55, 0.32, uDeep);
    float rim = smoothstep(0.95, 0.985, rr) * (1.0 - smoothstep(0.985, 1.0, rr));
    c += vec3(0.9, 1.0, 1.0) * rim * 0.4;
    vec3 N = normalize(vec3(n2, z + 1e-4));
    vec3 Hh = normalize(normalize(vec3(-0.5, -0.75, 0.55)) + vec3(0.0, 0.0, 1.0));
    float spec = pow(max(dot(N, Hh), 0.0), 70.0);
    vec2 hp = n2 - vec2(-0.34, -0.47);
    hp = vec2(hp.x * 0.79 + hp.y * 0.61, -hp.x * 0.61 + hp.y * 0.79);
    float win = 1.0 - smoothstep(-0.02, 0.03, sdBox(hp, vec2(0.23, 0.085), 0.08));
    c = mix(c, vec3(1.0), win * mix(0.8, 0.5, uDeep));
    c += spec * mix(0.9, 0.5, uDeep);
    c += (1.0 - smoothstep(0.0, 0.075, length(n2 - vec2(0.5, 0.56)))) * 0.45;
    float cres = smoothstep(0.72, 0.9, rr) * (1.0 - smoothstep(0.9, 0.99, rr)) * smoothstep(0.1, 0.7, n2.y) * smoothstep(-0.6, 0.2, n2.x);
    c += vec3(0.6, 0.95, 1.0) * cres * 0.22;
    // 前方探照灯
    vec2 lp = vec2(0.66, 0.14);
    float ld = length(n2 - lp);
    float housing = smoothstep(0.16, 0.13, ld) * smoothstep(0.08, 0.11, ld);
    c = mix(c, vec3(0.62, 0.52, 0.36), housing * (0.15 + 0.6 * max(uDeep, uLamp)));
    c += vec3(1.0, 0.93, 0.72) * uLamp * (smoothstep(0.1, 0.0, ld) * 1.3 + exp(-ld * 7.0) * 0.35);
    float a = clamp((1.0 - r) / aaR, 0.0, 1.0);
    col = over(vec4(c, 1.0) * a, col);
  }
  // 键盘焦点环
  if (uFocus > 0.0) {
    float fa = (1.0 - smoothstep(0.011, 0.011 + aaR, abs(r - 1.09))) * uFocus * 0.9;
    col = over(vec4(1.0, 0.82, 0.35, 1.0) * fa, col);
  }
  o = col;
}`;

function createGL(canvas) {
  const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: true, antialias: false, powerPreference: 'low-power' });
  if (!gl) return null;
  let prog, tex, U = {};
  function sh(type, src) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function setup() {
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
    gl.bindAttribLocation(prog, 0, 'a'); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, PIX);
    gl.useProgram(prog);
    for (const n of ['uTex', 'uRes', 'uKnob', 'uStretch', 'uScale', 'uPad', 'uR', 'uLamp', 'uDeep', 'uFocus', 'uTime']) U[n] = gl.getUniformLocation(prog, n);
    gl.uniform1i(U.uTex, 0);
    gl.disable(gl.BLEND);
  }
  setup();
  let lost = false;
  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); lost = true; });
  canvas.addEventListener('webglcontextrestored', () => { U = {}; setup(); lost = false; });
  return {
    draw(o) {
      if (lost) return;
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, PIX);
      gl.uniform2f(U.uRes, canvas.width, canvas.height);
      gl.uniform2f(U.uKnob, o.kx, o.ky);
      gl.uniform2f(U.uStretch, o.sx, o.sy);
      gl.uniform1f(U.uScale, canvas.width / FULLW);
      gl.uniform1f(U.uPad, PAD);
      gl.uniform1f(U.uR, o.r);
      gl.uniform1f(U.uLamp, o.lamp);
      gl.uniform1f(U.uDeep, o.deep);
      gl.uniform1f(U.uFocus, o.focus);
      gl.uniform1f(U.uTime, o.t);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    },
  };
}

/* 没有 WebGL2 时的 2D 退路：像素轨道照常，旋钮只画一个简化玻璃球 */
function create2D(canvas) {
  const ctx = canvas.getContext('2d'); if (!ctx) return null;
  const off = document.createElement('canvas'); off.width = W; off.height = H;
  const octx = off.getContext('2d'), img = octx.createImageData(W, H);
  return {
    draw(o) {
      img.data.set(PIX); octx.putImageData(img, 0, 0);
      const s = canvas.width / FULLW;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.imageSmoothingEnabled = false;
      ctx.save(); ctx.beginPath(); ctx.roundRect ? ctx.roundRect(PAD * s, PAD * s, W * s, H * s, 5 * s) : ctx.rect(PAD * s, PAD * s, W * s, H * s); ctx.clip();
      ctx.drawImage(off, PAD * s, PAD * s, W * s, H * s); ctx.restore();
      const x = (o.kx + PAD) * s, y = (o.ky + PAD) * s, r = o.r * s;
      ctx.save(); ctx.translate(x, y); ctx.scale(o.sx, o.sy);
      const g = ctx.createRadialGradient(-r * 0.35, -r * 0.45, r * 0.05, 0, 0, r);
      g.addColorStop(0, 'rgba(255,255,255,.75)'); g.addColorStop(0.3, 'rgba(200,240,255,.12)'); g.addColorStop(0.88, 'rgba(160,220,255,.18)'); g.addColorStop(1, 'rgba(255,255,255,.7)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    },
  };
}

const Sound = (() => {

  function osc(type, f, to, t0, t1) { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.connect(to); o.start(t0); if (t1 !== undefined) o.stop(t1); return o; }
  function filt(type, f, q, to) { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; if (to) b.connect(to); return b; }
  function env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }

    noise = makeNoise(2);
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 3.5; comp.attack.value = 0.004; comp.release.value = 0.25;
    comp.connect(ctx.destination);
    master = gain(0, comp);
    vol = gain(volumeOf(0), master);
    const rev = ctx.createConvolver(); rev.buffer = makeIR(3.4, 2.6);
    revIn = gain(1); revOut = gain(0.2, vol); revIn.connect(rev); rev.connect(revOut);
    music = gain(0.85); musicLP = filt('lowpass', 9000, 0.5, vol); music.connect(musicLP); musicLP.connect(gain(0.32, revIn));
    amb = gain(1, vol);
    sfx = gain(0.9, vol); sfx.connect(gain(0.3, revIn));
    for (const k of ['pad', 'kalimba', 'bass']) G[k] = gain(0, music);
    for (const k of ['waves', 'whale', 'sonar', 'drone']) G[k] = gain(0, amb);
    G.whale.connect(gain(0.9, revIn)); G.sonar.connect(gain(0.5, revIn));
    // 声呐回声：附点八分音符反馈延迟
    sonarIn = gain(1, G.sonar);
    const dl = ctx.createDelay(2); dl.delayTime.value = STEP * 3;
    const dlf = filt('lowpass', 2200, 0.5), fb = gain(0.4);
    sonarIn.connect(dl); dl.connect(dlf); dlf.connect(fb); fb.connect(dl); dlf.connect(G.sonar);
    // 海浪：低通噪声 + 慢速 LFO 涌动，外加一层浪花嘶声
    const t0 = ctx.currentTime;
    wavesLP = filt('lowpass', 1000, 0.3);
    const wAmp = gain(0.5, G.waves); wavesLP.connect(wAmp); noiseSrc(wavesLP, t0);
    osc('sine', 0.12, gain(0.4, wAmp.gain), t0); osc('sine', 0.071, gain(0.14, wAmp.gain), t0);
    const foamBP = filt('bandpass', 3400, 0.7), fAmp = gain(0.09, G.waves); foamBP.connect(fAmp); noiseSrc(foamBP, t0, 0, 0.77);
    osc('sine', 0.12, gain(0.08, fAmp.gain), t0);
    // 深海低鸣：失谐锯齿 + 共振低通 + 次低音 + 隆隆声
    const dLP = filt('lowpass', 240, 5, G.drone);
    for (const [m, det, a] of [[26, 0, 0.16], [26, 7, 0.16], [33, -4, 0.11], [38, 3, 0.09]]) { const o = osc('sawtooth', mtof(m), gain(a, dLP), t0); o.detune.value = det; }
    osc('sine', mtof(38), gain(0.28, G.drone), t0);
    osc('sine', 0.055, gain(110, dLP.frequency), t0);
    const rLP = filt('lowpass', 120, 0.7, gain(0.5, G.drone)); noiseSrc(rLP, t0, 0, 0.5);
    nextT = ctx.currentTime + 0.08;
    timer = setInterval(schedule, 25);
    return true;
  }

  /* ---------- 乐器 ---------- */
  function pad(ch, t) {
    const dur = BEAT * 4, g = gain(0, filt('lowpass', 900, 0.6, G.pad));
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.07, t + 0.9); g.gain.setValueAtTime(0.07, t + dur - 0.15); g.gain.linearRampToValueAtTime(0, t + dur + 1.1);
    for (const m of ch.tones) for (const det of [-7, 7]) { const o = osc('sawtooth', mtof(m - 12), g, t, t + dur + 1.2); o.detune.value = det; }
    osc('triangle', mtof(ch.tones[0] - 24), gain(0.6, g), t, t + dur + 1.2);
  }
  function kalimba(m, t, v) {
    const f = mtof(m), g = gain(0, G.kalimba);
    env(g, t, 0.004, 0.3 * v, 1.5);
    osc('sine', f, g, t, t + 1.7);
    const g2 = gain(0, g); env(g2, t, 0.002, 0.5 * v, 0.16); osc('sine', f * 5.95, g2, t, t + 0.3);
    const g3 = gain(0, g); env(g3, t, 0.003, 0.25 * v, 0.5); osc('triangle', f * 2, g3, t, t + 0.6);
  }
  function bassNote(m, t, len, v = 1) {
    const g = gain(0, filt('lowpass', 700, 0.8, G.bass));
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.42 * v, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.18 * v, t + len * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + len + 0.12);
    osc('sine', mtof(m), g, t, t + len + 0.15);
    osc('triangle', mtof(m), gain(0.35, g), t, t + len + 0.15);
  }
  function kick(t, v = 1) {
    const g = gain(0, G.bass); env(g, t, 0.004, 0.7 * v, 0.32);
    const o = osc('sine', 110, g, t, t + 0.4); o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.2);
  }
  function shaker(t, v) { const g = gain(0, G.bass); env(g, t, 0.003, 0.07 * v, 0.06); noiseSrc(filt('highpass', 6500, 0.7, g), t, t + 0.1); }
  function whale(t) {
    const base = [146.8, 110, 174.6, 130.8][Math.floor(Math.random() * 4)];
    const g = gain(0, filt('lowpass', 1300, 0.7, G.whale));
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.36, t + 0.5); g.gain.setValueAtTime(0.36, t + 2.3); g.gain.linearRampToValueAtTime(0, t + 3.3);
    for (const [mul, a] of [[1, 1], [2, 0.22], [3.01, 0.08]]) {
      const o = osc('sine', base * mul, gain(a, g), t, t + 3.4), f = o.frequency;
      f.setValueAtTime(base * mul, t); f.exponentialRampToValueAtTime(base * mul * 1.68, t + 1.1);
      f.exponentialRampToValueAtTime(base * mul * 1.5, t + 1.7); f.exponentialRampToValueAtTime(base * mul * 0.7, t + 3.2);
      osc('sine', 4.6, gain(base * mul * 0.018, f), t, t + 3.4);
    }
  }
  function ping(t) {
    const g = gain(0, sonarIn); env(g, t, 0.004, 0.4, 1.4); osc('sine', 1174.66, g, t, t + 1.5);
    const g2 = gain(0, sonarIn); env(g2, t, 0.002, 0.12, 0.1); osc('sine', 1174.66 * 2.76, g2, t, t + 0.15);
  }

  /* ---------- 编排器：每 25ms 往前排 140ms ---------- */
  function schedule() {
    if (!ctx || ctx.state !== 'running') return;
    if (nextT < ctx.currentTime - 0.2) nextT = ctx.currentTime + 0.05;
    while (nextT < ctx.currentTime + 0.14) {
      const t = nextT, bar = Math.floor(step / 16), s = step % 16, ch = CHORDS[bar];
      if (s === 0) { barLog.push([t, bar]); if (barLog.length > 4) barLog.shift(); pad(ch, t); }
      if (lv.kalimba > 0.01 && s % 2 === 0) {
        const idx = KP[bar][s / 2];
        if (idx >= 0) kalimba(ch.tones[idx % 3] + 12 * Math.floor(idx / 3), t, s % 4 === 0 ? 1 : 0.7);
        if (loopN % 2 === 1 && s === 14 && bar < 3) kalimba(ch.tones[2] + 12, t + STEP, 0.5);
      }
      if (lv.bass > 0.01) {
        if (s === 0) { kick(t); bassNote(ch.bass, t, BEAT * 1.2); }
        if (s === 6) bassNote(ch.bass, t, 0.3, 0.8);
        if (s === 8) kick(t, 0.6);
        if (s === 10) bassNote(ch.bass + 7, t, 0.3, 0.75);
        if (s === 14) bassNote(bar === 3 ? ch.bass + 4 : ch.bass + 12, t, 0.22, 0.7);
        if (s === 4 || s === 12) shaker(t, 1); else if (s % 2 === 0) shaker(t, 0.4);
      }
      if (lv.whale > 0.02 && s === 4 && (bar === 0 || bar === 2) && Math.random() < 0.85) whale(t);
      if (lv.sonar > 0.02 && s === 0 && bar % 2 === 0) ping(t);
      nextT += STEP; step = (step + 1) % 64; if (step === 0) loopN++;
    }
  }

  /* ---------- 随深度调整混音（节流） ---------- */
  function update(d, v, now) {
    lv = layerLevels(d);
    if (!ctx || !started) return;
    if (Math.abs(d - lastD) < 0.5 && Math.abs(v - lastV) < 0.001 && now - lastUpd < 500) return;
    if (now - lastUpd < 45) return;
    lastD = d; lastV = v; lastUpd = now;
    const t = ctx.currentTime, tc = 0.12;
    G.waves.gain.setTargetAtTime(lv.waves * 0.6, t, tc);
    G.kalimba.gain.setTargetAtTime(lv.kalimba * 0.55, t, tc);
    G.bass.gain.setTargetAtTime(lv.bass * 0.75, t, tc);
    G.whale.gain.setTargetAtTime(lv.whale * 0.6, t, tc);
    G.sonar.gain.setTargetAtTime(lv.sonar * 0.3, t, tc);
    G.drone.gain.setTargetAtTime(lv.drone * 0.7, t, tc);
    G.pad.gain.setTargetAtTime(0.55 - 0.2 * smooth(2000, 6000, d), t, tc);
    musicLP.frequency.setTargetAtTime(9000 * Math.pow(1400 / 9000, smooth(0, 6000, d)), t, tc);
    wavesLP.frequency.setTargetAtTime(d < 1 ? 1100 : 420, t, 0.06);
    vol.gain.setTargetAtTime(volumeOf(v), t, 0.05);
    revOut.gain.setTargetAtTime(0.18 + 0.45 * smooth(0, 4000, d), t, 0.2);
  }

  /* ---------- 音效 ---------- */
  function blip(t, f, a = 0.1, to = sfx) {
    const g = gain(0, to); env(g, t, 0.004, a, 0.07);
    const o = osc('sine', f, g, t, t + 0.12); o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 2.3, t + 0.06);
  }
  const fx = {
    splash() {
      const t = ctx.currentTime, bp = filt('bandpass', 2400, 0.8), g = gain(0, sfx);
      bp.connect(g); env(g, t, 0.01, 0.55, 0.6);
      bp.frequency.setValueAtTime(2600, t); bp.frequency.exponentialRampToValueAtTime(420, t + 0.55); noiseSrc(bp, t, t + 0.7);
      const g2 = gain(0, sfx); env(g2, t, 0.005, 0.4, 0.25);
      const o = osc('sine', 150, g2, t, t + 0.3); o.frequency.exponentialRampToValueAtTime(55, t + 0.25);
      for (let i = 0; i < 8; i++) blip(t + 0.08 + Math.random() * 0.55, 380 + Math.random() * 700, 0.07);
    },
    surface() {
      const t = ctx.currentTime; blip(t, 320, 0.12); blip(t + 0.06, 520, 0.08);
      const bp = filt('bandpass', 1800, 1), g = gain(0, sfx); bp.connect(g); env(g, t, 0.005, 0.2, 0.25); noiseSrc(bp, t, t + 0.3);
    },
    tick(d) { blip(ctx.currentTime, 1000 - 560 * smooth(0, 6000, d) + Math.random() * 120, 0.05); },
    grab() { const t = ctx.currentTime; for (const [f, a] of [[1760, 0.09], [2637, 0.05]]) { const g = gain(0, sfx); env(g, t, 0.003, a, 0.28); osc('sine', f, g, t, t + 0.35); } },
    release() { const t = ctx.currentTime; for (const [f, a] of [[1318.5, 0.07], [1975.5, 0.04]]) { const g = gain(0, sfx); env(g, t, 0.003, a, 0.32); osc('sine', f, g, t, t + 0.4); } },
    jelly(i) {
      const t = ctx.currentTime, m = [86, 89, 93, 81][i % 4];
      for (const [det, a] of [[0, 0.13], [6, 0.08]]) {
        const g = gain(0, sfx); env(g, t, 0.005, a, 1.8);
        const c = osc('sine', mtof(m), g, t, t + 2); c.detune.value = det;
        const mg = gain(mtof(m) * 2.2); mg.gain.setValueAtTime(mtof(m) * 2.2, t); mg.gain.exponentialRampToValueAtTime(1, t + 1.2);
        osc('sine', mtof(m) * 3.5, mg, t, t + 2); mg.connect(c.frequency);
      }
      for (let k = 0; k < 3; k++) { const g = gain(0, sfx); env(g, t + 0.09 * (k + 1), 0.004, 0.035, 0.5); osc('triangle', mtof(m + [7, 12, 15][k]), g, t, t + 1); }
    },
    lamp() {
      const t = ctx.currentTime, g = gain(0, sfx); env(g, t, 0.002, 0.3, 0.03); noiseSrc(filt('highpass', 3000, 0.7, g), t, t + 0.06);
      const g2 = gain(0, sfx); env(g2, t + 0.02, 0.005, 0.25, 0.08); osc('sine', 90, g2, t, t + 0.15);
      const g3 = gain(0, sfx); g3.gain.setValueAtTime(0, t); g3.gain.linearRampToValueAtTime(0.06, t + 0.25); g3.gain.linearRampToValueAtTime(0, t + 0.7);
      osc('sawtooth', 110, filt('lowpass', 500, 1, g3), t, t + 0.75);
    },
    growl() {
      const t = ctx.currentTime, g = gain(0, sfx); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.25, t + 0.15); g.gain.linearRampToValueAtTime(0, t + 0.9);
      const lp = filt('lowpass', 320, 2, g); noiseSrc(lp, t, t + 1, 0.4);
      const o = osc('sawtooth', 58, gain(0.25, lp), t, t + 1); o.frequency.linearRampToValueAtTime(44, t + 0.9);
    },
    chest() {
      const t = ctx.currentTime;
      const g = gain(0, sfx); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.16, t + 0.06); g.gain.linearRampToValueAtTime(0, t + 0.55);
      const o = osc('sawtooth', 80, filt('bandpass', 900, 3, g), t, t + 0.6); o.frequency.linearRampToValueAtTime(118, t + 0.5);
      osc('sine', 9, gain(14, o.frequency), t, t + 0.6);
      const g2 = gain(0, sfx); env(g2, t + 0.4, 0.005, 0.4, 0.5); const b = osc('sine', 70, g2, t + 0.4, t + 1); b.frequency.exponentialRampToValueAtTime(40, t + 0.9);
      [74, 77, 81, 84, 86, 89, 93, 96, 98, 101, 105].forEach((m, i) => { const gg = gain(0, sfx); env(gg, t + 0.45 + i * 0.055, 0.003, 0.09, 0.5); osc('triangle', mtof(m), gg, t + 0.45 + i * 0.055, t + 1.2 + i * 0.055); });
      const g3 = gain(0, sfx); g3.gain.setValueAtTime(0, t + 0.45); g3.gain.linearRampToValueAtTime(0.06, t + 0.6); g3.gain.exponentialRampToValueAtTime(0.0001, t + 2);
      noiseSrc(filt('highpass', 7000, 0.7, g3), t + 0.45, t + 2.1);
    },
  };

  return {
    get started() { return started; },
    get enabled() { return enabled; },
    get startedAt() { return startedAt; },
    unlock() {
      if (!ctx && !init()) return;
      if (ctx.state !== 'running' && enabled && !document.hidden) ctx.resume();
      if (!started) { started = true; startedAt = performance.now(); lastUpd = 0; master.gain.setTargetAtTime(enabled ? 1 : 0, ctx.currentTime, 0.3); }
    },
    setEnabled(on) {
      enabled = on;
      if (!ctx) return;
      if (on && ctx.state !== 'running') ctx.resume();
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(on && started ? 1 : 0, ctx.currentTime, 0.08);
    },
    suspend() { if (ctx && ctx.state === 'running') ctx.suspend(); },
    resume() { if (ctx && enabled && started) ctx.resume(); },
    update,
    play(name, arg) { if (ctx && started && enabled && ctx.state === 'running') fx[name](arg); },
    // 当前小节与拍（音频未启动时按页面时间推算，界面照样跳动）
    clock(nowSec) {
      if (ctx && started && barLog.length) {
        const t = ctx.currentTime; let cur = barLog[0];
        for (const b of barLog) if (b[0] <= t) cur = b;
        const beat = clamp(Math.floor((t - cur[0]) / BEAT), 0, 3);
        return { bar: cur[1], beat, chord: CHORDS[cur[1]].name };
      }
      const b = Math.floor(nowSec / BEAT);
      return { bar: Math.floor(b / 4) % 4, beat: b % 4, chord: CHORDS[Math.floor(b / 4) % 4].name };
    },
  };
})();

/* ============================================================
   布局、输入、弹簧、界面、主循环
   ============================================================ */
const $ = id => document.getElementById(id);
const slider = $('slider'), canvas = $('view');
let R = null;
try { R = createGL(canvas); } catch (e) { console.warn(e); R = null; }
if (!R) R = create2D(canvas);

/* 尺寸：尽量让每个轨道像素占整数个设备像素 */
function layout() {
  const vw = document.documentElement.clientWidth, vh = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const avail = Math.min(vw - 32, 860);
  let s = avail / FULLW;
  s = Math.min(s, Math.max(1.2, (vh * 0.42) / FULLH));
  const si = Math.floor(s * dpr) / dpr;
  if (si >= 0.92 * s && si >= 1) s = si;
  const cw = Math.round(FULLW * s), ch = Math.round(FULLH * s);
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  document.documentElement.style.setProperty('--w', cw + 'px');
  const ruler = $('ruler'); ruler.style.width = cw + 'px';
  const compact = cw < 470;
  ruler.innerHTML = DK.map(([v, d]) => `<span style="left:${((PAD + xOfV(v)) / FULLW * 100).toFixed(2)}%">${compact && d >= 1000 ? d / 1000 + 'k' : d.toLocaleString('en-US')}${d === 6000 ? ' m' : ''}</span>`).join('');
}
layout();
addEventListener('resize', layout);

/* ---------- 输入 ---------- */
function trackX(e) { const r = canvas.getBoundingClientRect(); return (e.clientX - r.left) / r.width * FULLW - PAD; }
function trackY(e) { const r = canvas.getBoundingClientRect(); return (e.clientY - r.top) / r.height * FULLH - PAD; }
let lastTickV = 0, lastTickT = 0;
function setTarget(v, fromKey) {
  v = clamp(v, 0, 1);
  if (Math.abs(v - lastTickV) > 0.012 && performance.now() - lastTickT > 45) { Sound.play('tick', depthOf(v)); lastTickV = v; lastTickT = performance.now(); }
  S.tv = v;
  if (fromKey) announce();
}
slider.addEventListener('pointerdown', e => {
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  Sound.unlock();
  const x = trackX(e), y = trackY(e);
  const onKnob = Math.hypot(x - S.kx, y - S.ky) <= KR + 3;
  S.grabOff = onKnob ? x - S.kx : 0;
  if (!onKnob) setTarget(vOfX(x));                         // 点击轨道：弹簧追过去
  S.drag = true; slider.classList.add('dragging');
  Sound.play('grab');
  slider.setPointerCapture(e.pointerId);
  slider.focus({ preventScroll: true }); S.focus = false;
  e.preventDefault();
});
slider.addEventListener('pointermove', e => { if (S.drag) setTarget(vOfX(trackX(e) - S.grabOff)); });
const endDrag = e => {
  if (!S.drag) return;
  S.drag = false; slider.classList.remove('dragging'); Sound.play('release'); announce();
  try { slider.releasePointerCapture(e.pointerId); } catch (_) { /* 已释放 */ }
};
slider.addEventListener('pointerup', endDrag);
slider.addEventListener('pointercancel', endDrag);
slider.addEventListener('lostpointercapture', endDrag);
slider.addEventListener('keydown', e => {
  const step = e.shiftKey ? 0.1 : 0.02;
  const map = { ArrowRight: step, ArrowUp: step, ArrowLeft: -step, ArrowDown: -step, PageUp: 0.1, PageDown: -0.1 };
  let v = null;
  if (e.key in map) v = S.tv + map[e.key];
  else if (e.key === 'Home') v = 0;
  else if (e.key === 'End') v = 1;
  if (v === null) return;
  e.preventDefault(); S.focus = true; Sound.unlock(); setTarget(v, true);
});
slider.addEventListener('focus', () => { S.focus = !S.drag; });
slider.addEventListener('blur', () => { S.focus = false; });
// 首次交互后启动音频
for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) addEventListener(ev, () => Sound.unlock(), { passive: true });
const soundBtn = $('soundBtn');
soundBtn.addEventListener('click', () => {
  // 第一次点它只是启动音频（声音默认开），之后才是开关
  const justStarted = performance.now() - Sound.startedAt < 800;
  Sound.unlock();
  const on = justStarted ? true : !Sound.enabled;
  Sound.setEnabled(on); soundBtn.setAttribute('aria-pressed', String(on));
  $('soundLbl').textContent = on ? '声音 开' : '声音 关';
});
document.addEventListener('visibilitychange', () => { document.hidden ? Sound.suspend() : Sound.resume(); });

/* ---------- 弹簧：滞后、拉伸、回弹 ---------- */
const K1 = REDUCED ? 420 : 240, Z1 = REDUCED ? 1 : 0.52, C1 = 2 * Math.sqrt(K1) * Z1;
const K2 = 520, C2 = 2 * Math.sqrt(K2) * 0.26;
function physics(dt) {
  const n = Math.ceil(dt / (1 / 240));
  const h = dt / n;
  for (let i = 0; i < n; i++) {
    S.vel += (K1 * (S.tv - S.v) - C1 * S.vel) * h; S.v += S.vel * h;
    const sT = REDUCED ? 0 : clamp(Math.abs(S.vel) * 0.12, 0, 0.2);
    S.stv += (K2 * (sT - S.st) - C2 * S.stv) * h; S.st += S.stv * h;
  }
  S.press += ((S.drag ? 1 : 0) - S.press) * Math.min(1, dt * 12);
  const vv = clamp(S.v, -0.05, 1.05);
  S.kx = xOfV(vv);
  S.depth = depthOf(S.v);
  S.ky = KY + (S.depth < 1 ? Math.sin(S.t * 2.1) * 0.9 : Math.sin(S.t * 1.2) * 0.5);
}

/* ---------- 深度事件：入水、水母、探照灯、鮟鱇、宝箱 ---------- */
let prevKx = S.kx;
function events(dt) {
  const d = S.depth;
  if (S.surfaced && d > 2) { S.surfaced = false; spawnSplash(S.kx, 16); Sound.play('splash'); }
  else if (!S.surfaced && d < 0.6) { S.surfaced = true; spawnSplash(S.kx, 6); Sound.play('surface'); }
  for (const j of jellies) {
    if ((prevKx - j.x) * (S.kx - j.x) < 0 && j.flash < 0.6) { j.flash = 1; Sound.play('jelly', j.note); }
  }
  prevKx = S.kx;
  if (!S.lampOn && d > 850) { S.lampOn = true; S.lampT = S.t; Sound.play('lamp'); }
  else if (S.lampOn && d < 700) S.lampOn = false;
  if (S.lampOn) {
    S.lampBase = Math.min(1, S.lampBase + dt * 2.5);
    const k = S.t - S.lampT;                                // 点亮时闪两下
    S.lamp = S.lampBase * (k < 0.5 ? [1, 0.12, 1, 0.08, 1][Math.floor(k * 10) % 5] : 1);
  } else { S.lampBase = Math.max(0, S.lampBase - dt * 3); S.lamp = S.lampBase; }
  const near = Math.abs(S.kx - 140) < 17;
  if (near && !S.angNear) Sound.play('growl');
  S.angNear = near;
  if (!S.chestOpen && S.kx > 146.5) { S.chestOpen = true; spawnGold(36); if (S.chestArmed) Sound.play('chest'); S.chestArmed = false; }
  else if (S.chestOpen && S.kx < 138) { S.chestOpen = false; }
  if (!S.chestOpen && S.kx < 125) S.chestArmed = true;
}

/* ---------- 界面 ---------- */
const PAGE = [[0, [201, 243, 241]], [0.12, [150, 226, 230]], [0.28, [66, 166, 190]], [0.42, [22, 96, 136]], [0.55, [12, 56, 96]],
  [0.7, [8, 32, 64]], [0.85, [5, 17, 38]], [1, [3, 8, 18]]];
const ui = { d: -1, zone: null, track: '', tone: '', bar: -1, beat: -1, layers: '', vol: -1 };
const layerEls = [...document.querySelectorAll('#layers i')];
const chordEls = [...document.querySelectorAll('#chords b')], beatEls = [...document.querySelectorAll('#beats i')];
const rgb = c => `rgb(${c.map(v => Math.round(v)).join(',')})`;
const meta = document.querySelector('meta[name="theme-color"]');
function announce() {
  const d = Math.round(depthOf(S.tv)), z = zoneOf(d), vol = Math.round(volumeOf(S.tv) * 100);
  slider.setAttribute('aria-valuenow', d);
  slider.setAttribute('aria-valuetext', `${d.toLocaleString('zh-CN')} 米，${z.zh}，音量 ${vol}%`);
}
function updateUI(now) {
  const d = Math.round(S.depth);
  if (d !== ui.d) {
    ui.d = d; $('depthNum').textContent = d.toLocaleString('en-US');
    const z = zoneOf(S.depth);
    if (z !== ui.zone) { ui.zone = z; $('zoneZh').textContent = z.zh; $('zoneEn').textContent = z.en; $('live').textContent = z.zh; }
    $('zoneBar').style.width = (clamp(S.v, 0, 1) * 100).toFixed(1) + '%';
    const track = S.chestOpen ? '深渊宝藏' : z.track;
    if (track !== ui.track) { ui.track = track; $('trackName').textContent = `「${track}」`; }
    if (!S.drag) announce();
  }
  const vol = Math.round(volumeOf(S.v) * 100);
  if (vol !== ui.vol) { ui.vol = vol; $('volLbl').textContent = `音量 ${vol}%`; }
  // 页面色调
  const v = clamp(S.v, 0, 1), bg = grad(PAGE, v), bg2 = bg.map((c, i) => lerp(c, [255, 255, 255][i], 0.45 * (1 - v)) + [0, 10, 24][i] * v);
  const tone = rgb(bg);
  if (tone !== ui.tone) {
    ui.tone = tone;
    const lum = (0.2126 * bg[0] + 0.7152 * bg[1] + 0.0722 * bg[2]) / 255, light = lum < 0.36;
    const st = document.documentElement.style;
    st.setProperty('--bg', tone); st.setProperty('--bg2', rgb(bg2));
    st.setProperty('--ink', light ? '#d7eef6' : '#073241');
    st.setProperty('--ink2', light ? 'rgba(200,228,240,.62)' : 'rgba(7,50,65,.62)');
    st.setProperty('--line', light ? 'rgba(180,220,240,.16)' : 'rgba(7,50,65,.16)');
    st.setProperty('--panel', light ? `rgba(120,180,220,${(0.08 - v * 0.03).toFixed(3)})` : 'rgba(255,255,255,.34)');
    st.setProperty('--chip', light ? 'rgba(180,220,240,.12)' : 'rgba(7,50,65,.08)');
    st.setProperty('--accent', light ? '#5fd6e8' : '#0d7f95');
    st.setProperty('--accent-ink', light ? '#04121e' : '#ffffff');
    st.setProperty('--sun', (1 - smooth(0, 0.3, v)).toFixed(3));
    meta.setAttribute('content', tone);
  }
  // 当前音乐：和弦、拍点、声部
  const c = Sound.clock(now / 1000);
  if (c.bar !== ui.bar) { ui.bar = c.bar; chordEls.forEach((el, i) => el.classList.toggle('on', i === c.bar)); }
  if (c.beat !== ui.beat) { ui.beat = c.beat; beatEls.forEach((el, i) => el.classList.toggle('on', i === c.beat)); }
  const lv = layerLevels(S.depth), key = layerEls.map(el => (lv[el.dataset.l] > 0.15 ? 1 : 0)).join('');
  layerEls.forEach(el => { el.style.opacity = (0.3 + 0.7 * lv[el.dataset.l]).toFixed(2); });
  if (key !== ui.layers) { ui.layers = key; layerEls.forEach((el, i) => el.classList.toggle('on', key[i] === '1')); }
  const hint = Sound.started ? '拖动潜水球、点击轨道，或用 ← → / Home / End 下潜' : '轻触潜水球或轨道开启声音 · 也可用 ← → / Home / End';
  if ($('hint').textContent !== hint) $('hint').textContent = hint;
}

/* ---------- 主循环 ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; S.t += dt;
  physics(dt);
  events(dt);
  updateScene(dt, S.t);
  renderScene(S.t);
  const s = S.st;
  if (R) R.draw({ kx: S.kx, ky: S.ky, r: KR * (1 + 0.035 * S.press), sx: 1 + s, sy: 1 - s * 0.55, lamp: S.lamp, deep: smooth(300, 2500, S.depth), focus: S.focus ? 1 : 0, t: S.t });
  Sound.update(S.depth, S.v, now);
  updateUI(now);
  requestAnimationFrame(frame);
}
announce();
requestAnimationFrame(frame);
</script>
</body>
</html>
